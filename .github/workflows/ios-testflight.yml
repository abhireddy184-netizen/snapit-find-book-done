# Unsigned simulator build on every push to the Capacitor branch.
# Signed TestFlight upload on the same triggers, but only when the App Store
# Connect API secrets exist. Does not run on main, and does not submit for review.
name: iOS

on:
  push:
    branches:
      - cursor/capacitor-remote-shell-f9cb
    tags:
      - "ios-release*"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    name: iOS simulator (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d /Applications/Xcode_26.6.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.0.app
          else
            echo "Xcode 26.6 was not found. Installed Xcode apps:"
            ls -1 /Applications | grep -i xcode || true
            exit 1
          fi
          xcodebuild -version

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync Capacitor iOS project
        run: bun run cap:sync

      - name: Build for the iOS Simulator without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  testflight:
    name: TestFlight upload
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check App Store Connect secrets
        id: gate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${ASC_KEY_ID}" ] && missing+=("ASC_KEY_ID")
          [ -z "${ASC_ISSUER_ID}" ] && missing+=("ASC_ISSUER_ID")
          [ -z "${ASC_KEY_P8_BASE64}" ] && missing+=("ASC_KEY_P8_BASE64")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice title=TestFlight skipped::Missing repository secrets: ${missing[*]}. Add them under Settings → Secrets and variables → Actions, then re-run this workflow or push an ios-release tag. Nothing was uploaded and nothing was submitted for review."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select latest stable Xcode
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d /Applications/Xcode_26.6.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.0.app
          else
            echo "Xcode 26.6 was not found. Installed Xcode apps:"
            ls -1 /Applications | grep -i xcode || true
            exit 1
          fi
          xcodebuild -version

      - name: Setup bun
        if: steps.gate.outputs.ready == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies and sync
        if: steps.gate.outputs.ready == 'true'
        run: |
          bun install --frozen-lockfile
          bun run cap:sync

      - name: Write App Store Connect API key
        if: steps.gate.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          python3 - << 'PY'
          import os, base64, pathlib
          raw = "".join(os.environ["ASC_KEY_P8_BASE64"].split())
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / f"AuthKey_{os.environ['ASC_KEY_ID']}.p8"
          path.write_bytes(base64.b64decode(raw))
          path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"ASC_KEY_PATH={path}\n")
          PY

      - name: Archive and upload to TestFlight
        if: steps.gate.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/GetPros.xcarchive"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM=96DB94MY2K \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }} (version 1.0) to App Store Connect. It is not submitted for App Store review."
